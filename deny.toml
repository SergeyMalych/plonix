# cargo-deny configuration: `cargo deny check` runs in CI on every push and
# pull request. See https://embarkstudios.github.io/cargo-deny/

[graph]
# The platforms Plonix is built and tested on.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
all-features = false

[advisories]
# Known vulnerabilities, unsound crates and unmaintained crates fail the
# check. Each ignore below needs a reason and should be revisited when the
# dependency that pulls it in is updated.
version = 2
yanked = "deny"
ignore = [
    # Unmaintained, no known vulnerability. A build-time macro dependency of
    # the GTK bindings (glib-macros 0.18) that Tauri uses on Linux only; it is
    # not part of the macOS app.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time dependency of Tauri's Linux GTK bindings" },
    # Unmaintained, no known vulnerability; superseded by rustls-pki-types.
    # Pulled in by ureq 2's native-certs feature.
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: transitive through ureq 2; goes away with ureq 3" },
]

[licenses]
version = 2
# Licenses the dependency tree actually uses that are compatible with
# shipping Plonix under Apache-2.0. Add to this list deliberately, in the pull
# request that brings in the dependency.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Several versions of the same crate are common in the app's dependency tree;
# report them, but don't fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
