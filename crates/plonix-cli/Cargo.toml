[package]
name = "plonix"
version = "0.1.1"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
plonix-core = { version = "0.1.1", path = "../plonix-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "2", default-features = false, features = ["json", "tls", "native-certs"] }

[dev-dependencies]
tempfile = "3.27.0"
