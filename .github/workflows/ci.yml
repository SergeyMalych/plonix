name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install app libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev
      - name: Test
        run: cargo test --workspace --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install app libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev
      # Bugs and suspicious code fail the build; style lints are reported as
      # warnings for now.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D clippy::correctness -D clippy::suspicious

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisories, licenses, duplicate crates and sources; see deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Plonix.app
        working-directory: crates/plonix-app
        run: npx --yes @tauri-apps/cli@2 build --bundles app -- --locked
      - name: Check the bundle
        run: |
          app=target/release/bundle/macos/Plonix.app
          test -x "$app/Contents/MacOS/Plonix"
          plutil -p "$app/Contents/Info.plist" | grep -E 'CFBundleName|CFBundleIdentifier|CFBundleShortVersionString'
          codesign --verify --verbose "$app" || true
      - name: Zip Plonix.app
        run: ditto -c -k --keepParent target/release/bundle/macos/Plonix.app Plonix-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Plonix-macOS
          path: Plonix-macOS.zip
          if-no-files-found: error
