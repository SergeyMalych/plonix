name: Release

# Pushing a tag like v0.2.0 builds Plonix.app, packages it as a disk image
# and a zip, signs the update package and publishes a GitHub release with the
# notes from CHANGELOG.md. Installed copies of Plonix find the release through
# latest.json, and only install it when their user says so.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the version
        run: |
          conf=crates/plonix-app/tauri.conf.json
          version=$(jq -r .version "$conf")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in $conf"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # Developer ID signing and notarization (docs/releasing.md). Without the
      # Apple secrets the release is still built, signed ad hoc instead, and
      # its notes say how to open it the first time. Only secrets that have a
      # value are exported, so Tauri picks Apple ID or API key.
      - name: Prepare signing
        env:
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          S_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          S_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          S_APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          S_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$S_UPDATER_KEY" ]; then
            echo "UPDATER=true" >> "$GITHUB_ENV"
          else
            echo "::warning::The TAURI_SIGNING_PRIVATE_KEY secret is not set, so this release has no update package. See docs/updates.md"
          fi
          if [ -z "$S_APPLE_CERTIFICATE" ] || [ -z "$S_APPLE_SIGNING_IDENTITY" ] || [ -z "$S_APPLE_ID$S_APPLE_API_KEY" ]; then
            echo "::warning::No Developer ID secrets, so this release is signed ad hoc and not notarized. See docs/releasing.md"
            echo "NOTARIZED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "NOTARIZED=true" >> "$GITHUB_ENV"
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER; do
            source_var="S_$name"; value="${!source_var}"
            [ -n "$value" ] || continue
            { echo "$name<<PLONIX_EOF"; printf '%s\n' "$value"; echo "PLONIX_EOF"; } >> "$GITHUB_ENV"
          done
          if [ -n "$S_APPLE_API_PRIVATE_KEY" ]; then
            key="$RUNNER_TEMP/AuthKey_$S_APPLE_API_KEY.p8"
            printf '%s\n' "$S_APPLE_API_PRIVATE_KEY" > "$key"; chmod 600 "$key"
            echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
          fi
      - name: Build Plonix.app
        working-directory: crates/plonix-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          config='{"bundle":{"createUpdaterArtifacts":'"${UPDATER:-false}"'}}'
          if [ "$NOTARIZED" != true ]; then
            config='{"bundle":{"createUpdaterArtifacts":'"${UPDATER:-false}"',"macOS":{"signingIdentity":"-"}}}'
          fi
          npx --yes @tauri-apps/cli@2 build --bundles app --target universal-apple-darwin --config "$config" -- --locked
      - name: Verify the signature and notarization
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/Plonix.app
          if [ "$NOTARIZED" = true ]; then
            scripts/macos/sign-and-notarize.sh --verify "$app"
          else
            codesign --verify --deep --strict --verbose=2 "$app"
          fi
      - name: Package
        run: |
          dir=target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent "$dir/Plonix.app" Plonix-macOS.zip
          # A disk image with the app and a link to Applications to drag it to.
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          ditto "$dir/Plonix.app" "$stage/Plonix.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Plonix -srcfolder "$stage" -fs HFS+ -format UDZO -ov Plonix-macOS.dmg
          if [ "$NOTARIZED" = true ]; then
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp Plonix-macOS.dmg
          fi
          hdiutil verify Plonix-macOS.dmg
      - name: Write the release notes
        run: |
          # The section for this version in CHANGELOG.md, plus how to open an
          # app that is not notarized yet.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            /^\[[^]]*\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1
          fi
          if [ "$NOTARIZED" != true ]; then
            cat >> notes.md <<'NOTES'

          ### Opening Plonix the first time

          This build is not notarized by Apple yet, so macOS asks before opening it the first time:

          1. Open `Plonix-macOS.dmg` and drag Plonix to Applications.
          2. Open Plonix. When macOS says it can't check the app, click **Done**.
          3. Open **System Settings › Privacy & Security**, scroll down and click **Open Anyway** next to Plonix, then confirm.

          Or, in Terminal: `xattr -dr com.apple.quarantine /Applications/Plonix.app`
          NOTES
          fi
          cat notes.md
      - name: Write latest.json
        if: env.UPDATER == 'true'
        run: |
          dir=target/universal-apple-darwin/release/bundle/macos
          cp "$dir/Plonix.app.tar.gz" Plonix-macOS.app.tar.gz
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Plonix-macOS.app.tar.gz"
          jq -n --arg v "$VERSION" --arg url "$url" --rawfile sig "$dir/Plonix.app.tar.gz.sig" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "See https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
               "darwin-aarch64": {url: $url, signature: $sig},
               "darwin-x86_64": {url: $url, signature: $sig}}}' > latest.json
          cat latest.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="Plonix-macOS.dmg Plonix-macOS.zip"
          if [ "$UPDATER" = true ]; then files="$files Plonix-macOS.app.tar.gz latest.json"; fi
          gh release create "$GITHUB_REF_NAME" --title "Plonix $VERSION" --notes-file notes.md $files
