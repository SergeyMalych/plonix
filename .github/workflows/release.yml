name: Release

# Pushing a tag like v0.2.0 builds Plonix.app, signs the update package and
# publishes a GitHub release with it. Installed copies of Plonix find the
# release through latest.json, and only install it when their user says so.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the version and the update key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          conf=crates/plonix-app/tauri.conf.json
          version=$(jq -r .version "$conf")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in $conf"; exit 1
          fi
          if [ -z "$(jq -r '.plugins.updater.pubkey // ""' "$conf")" ]; then
            echo "::error::plugins.updater.pubkey is empty in $conf. See docs/updates.md"; exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set. See docs/updates.md"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # Developer ID signing and notarization (docs/releasing.md). Only secrets
      # that have a value are exported, so Tauri picks Apple ID or API key.
      - name: Prepare signing
        env:
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          S_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          S_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          S_APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$S_APPLE_CERTIFICATE" ] || [ -z "$S_APPLE_SIGNING_IDENTITY" ] || [ -z "$S_APPLE_ID$S_APPLE_API_KEY" ]; then
            echo "::error::Signing secrets are missing. See docs/releasing.md"; exit 1
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER; do
            source_var="S_$name"; value="${!source_var}"
            [ -n "$value" ] || continue
            { echo "$name<<PLONIX_EOF"; printf '%s\n' "$value"; echo "PLONIX_EOF"; } >> "$GITHUB_ENV"
          done
          if [ -n "$S_APPLE_API_PRIVATE_KEY" ]; then
            key="$RUNNER_TEMP/AuthKey_$S_APPLE_API_KEY.p8"
            printf '%s\n' "$S_APPLE_API_PRIVATE_KEY" > "$key"; chmod 600 "$key"
            echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
          fi
      - name: Build Plonix.app
        working-directory: crates/plonix-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >
          npx --yes @tauri-apps/cli@2 build --bundles app --target universal-apple-darwin
          --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --locked
      - name: Verify the signature and notarization
        run: scripts/macos/sign-and-notarize.sh --verify target/universal-apple-darwin/release/bundle/macos/Plonix.app
      - name: Write latest.json
        run: |
          dir=target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent "$dir/Plonix.app" Plonix-macOS.zip
          cp "$dir/Plonix.app.tar.gz" Plonix-macOS.app.tar.gz
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Plonix-macOS.app.tar.gz"
          jq -n --arg v "$VERSION" --arg url "$url" --rawfile sig "$dir/Plonix.app.tar.gz.sig" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "See https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
               "darwin-aarch64": {url: $url, signature: $sig},
               "darwin-x86_64": {url: $url, signature: $sig}}}' > latest.json
          cat latest.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --title "Plonix $VERSION" --generate-notes
          Plonix-macOS.zip Plonix-macOS.app.tar.gz latest.json
