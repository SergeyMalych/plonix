[package]
name = "js-endpoints"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Built on its own, for wasm32-unknown-unknown; not part of the Plonix workspace.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
